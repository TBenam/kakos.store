<script>
        // Simple script to handle input focus state styling if needed beyond CSS
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.querySelector('input[type="text"]');
            const clearBtn = searchInput.nextElementSibling;

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchInput.focus();
            });
            
            // Focus styling handled by Tailwind focus: classes, but we can add logic for 'typing' state if needed
            searchInput.addEventListener('input', () => {
                if(searchInput.value.length > 0) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
            });
            
            // Initial check
            if(searchInput.value.length === 0) {
                clearBtn.classList.add('hidden');
            }
        });
    </script>
