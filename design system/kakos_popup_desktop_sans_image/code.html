<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
      </style>

<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden flex items-center justify-center font-body-md relative">
<!-- Background overlay simulating the dimmed homepage -->
<div class="absolute inset-0 bg-inverse-surface opacity-80 z-0"></div>
<!-- The Modal Container -->
<div class="relative z-10 w-[600px] bg-surface-container-lowest p-[80px] shadow-[4px_4px_0_0_#000000] border border-outline-variant flex flex-col items-center justify-center text-center">
<!-- Close Button (Absolute positioned within the modal) -->
<button aria-label="Close modal" class="absolute top-md right-md text-secondary hover:text-primary transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-[24px] font-bold">close</span>
</button>
<!-- Brand Logo/Name at the top -->
<div class="mb-lg">
<span class="font-display-lg text-headline-md text-primary tracking-tighter uppercase">KAKOS</span>
</div>
<!-- Headline -->
<h2 class="font-headline-lg text-headline-lg text-primary uppercase tracking-tight mb-md leading-none">
            REJOIGNEZ LE MONOLITHE
        </h2>
<!-- Subtext -->
<p class="font-body-lg text-body-lg text-secondary mb-xl max-w-md mx-auto">
            Recevez nos cadeaux et codes promos exclusifs directement sur WhatsApp.
        </p>
<!-- Input and Form -->
<form class="w-full max-w-[400px] flex flex-col gap-md items-center">
<!-- WhatsApp Input Field -->
<div class="w-full relative">
<label class="sr-only" for="whatsapp-number">Numéro WhatsApp</label>
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]">phone_iphone</span>
</div>
<input class="w-full h-[56px] pl-[44px] pr-md bg-surface border border-outline-variant text-primary font-body-md focus:border-primary focus:ring-0 focus:outline-none transition-colors" id="whatsapp-number" placeholder="Votre numéro de téléphone..." required="" type="tel"/>
</div>
<!-- Submit Button (Electric Cyan) -->
<!-- Using custom arbitrary value here to match the specific "Electric Cyan" prompt requirement -->
<button class="w-full h-[56px] bg-[#00F0FF] text-primary font-label-sm text-label-sm uppercase tracking-wider font-bold hover:bg-primary hover:text-on-primary transition-colors border border-primary flex items-center justify-center gap-xs" type="submit">
                S'INSCRIRE
                <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</form>
<div class="mt-md">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary underline uppercase transition-colors" href="#">NON MERCI, JE PASSE MON TOUR</a>
</div>
</div>
</body></html>
